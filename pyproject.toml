[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshtiq-ai-automation-portfolio"
version = "1.0.0"
description = "Portfolio examples for AI automation, lead routing, APIs, and resilient Python workflows"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
